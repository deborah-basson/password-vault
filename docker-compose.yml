version: '3.8'

services:
  password-vault:
    build:
      context: .
      dockerfile: Dockerfile
    image: password-vault:latest
    container_name: password-vault
    ports:
      - "8443:8443"
    volumes:
      - vault-data:/data
      - ./vault.db:/app/vault.db
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    networks:
      - vault-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  vault-data:
    driver: local

networks:
  vault-network:
    driver: bridge